# Cantoral de Torá — Netlify Configuration

[build]
  # Empaqueta el SDK de Netlify Identity para el navegador (assets/netlify-identity.js).
  # Las Functions (netlify/functions) y la base de datos se aprovisionan automáticamente.
  command = "npm run build"
  publish = "."

# Security & performance headers for all pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "autoplay=(self), microphone=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' https://www.hebcal.com https://www.sefaria.org; img-src 'self' data:; media-src 'self' blob:"

# Aggressive caching for static assets
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML should revalidate
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Service worker should revalidate to support updates
[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Manifest should revalidate
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# SPA-style fallback — redirect all paths to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
